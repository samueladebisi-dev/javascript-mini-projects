<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" type="module"></script>
  <title>Currency Converter</title>
</head>

<body>
  <h2>Currency Converter</h2>
  <div class="container converter">
    <div class="input-container">
      <input type="number" id="amount" placeholder="Enter amount" />
      <select id="fromCurrency">
        <!-- Filled in by script.js -->
      </select>
    </div>
    <div class="input-container">
      <input type="number" id="result" placeholder="Result" disabled />
      <select id="toCurrency">
        <!-- Filled in by script.js -->
      </select>
    </div>
    <button id="convertButton">Convert</button>
    <p class="note">Uses fixed sample rates (1 USD = 0.85 EUR, 0.74 GBP, 83.52 INR), not live market rates.</p>
    <div class="input-container">
      <input type="text" id="customCurrency" placeholder="Custom Currency (e.g., CAD)" />
      <button id="addCurrencyButton">Add Currency</button>
    </div>
  </div>
</body>

</html>
